# CI for the factory itself. Pin the actions to commit SHAs (for example with
# Renovate or pinact) before relying on this in production.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The embedded UI matches its source
        run: make ui && git diff --exit-code web/static
      - name: Install the pinned toolchain
        run: make tools
      - run: go vet ./...
      - run: .tools/bin/golangci-lint run ./...
      - name: Tests, including the full line with a fake LLM
        run: go test -race -timeout 20m ./...
      - name: Run every example spec through the line (PostgreSQL runs in the runner's Docker)
        run: |
          go build -o .tools/fliessband ./cmd/fliessband
          for spec in specs/*.yaml; do ./.tools/fliessband run -fuzztime 2s "$spec"; done
      - name: Known vulnerabilities in the factory
        run: .tools/bin/govulncheck ./...
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: mode=max
          sbom: true
          tags: fliessband:${{ github.sha }}
